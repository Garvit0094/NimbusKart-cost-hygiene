name: Cost Janitor

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  cost-janitor:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:4.0.0
        env:
          SERVICES: ec2,s3,sts,iam
          AWS_DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r janitor/requirements.txt

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Install tflocal
        run: pip install terraform-local

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: tflocal init
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          AWS_DEFAULT_REGION: us-east-1

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: terraform
        run: tflocal apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          AWS_DEFAULT_REGION: us-east-1

      - name: Run Cost Janitor (dry-run)
        run: python janitor/janitor.py --dry-run --output-dir reports
        env:
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          AWS_DEFAULT_REGION: us-east-1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-janitor-reports
          path: |
            reports/report.json
            reports/report.md

      - name: Comment PR if orphans exist
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('reports/report.json', 'utf8'));
            } catch {
              report = { summary: { total_orphans: 0, estimated_monthly_waste_usd: 0 } };
            }
            const body = `## \\u26a0\\ufe0f Cost Janitor Found Orphans\\n\\n` +
              `**Total orphans:** ${report.summary.total_orphans}\\n` +
              `**Estimated monthly waste:** $${report.summary.estimated_monthly_waste_usd.toFixed(2)}\\n\\n` +
              `> [!CAUTION]\\n` +
              `> Review and clean up orphaned resources before merging.\\n\\n` +
              `_Run \`python janitor/janitor.py --dry-run\` locally to see details._`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
